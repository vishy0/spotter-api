<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Route Planner - Interactive Visualizer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
        }

        #sidebar {
            width: 380px;
            min-width: 380px;
            background: #1e293b;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        input[type="text"] {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: #334155;
            color: #cbd5e1;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .preset-btn:hover {
            background: #475569;
            color: white;
        }

        .btn-submit {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .stat-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-card.highlight {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            margin-top: 4px;
        }

        .stat-card.highlight .stat-value {
            color: #34d399;
        }

        #stops-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .stop-item {
            background: #0f172a;
            border-left: 3px solid #f59e0b;
            padding: 10px;
            border-radius: 0 6px 6px 0;
            font-size: 12px;
        }

        .stop-item-title {
            font-weight: 600;
            color: #f8fafc;
        }

        .stop-item-meta {
            color: #94a3b8;
            margin-top: 3px;
        }

        .stop-item-cost {
            font-weight: 600;
            color: #fbbf24;
            margin-top: 4px;
        }

        #error-box {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 12px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-route { background: #3b82f6; border-radius: 2px; height: 4px; width: 16px; }
        .dot-start { background: #10b981; }
        .dot-stop { background: #f59e0b; }
        .dot-end { background: #ef4444; }

        /* Leaflet popup overrides */
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #475569;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .leaflet-popup-tip {
            background: #1e293b;
        }

        .popup-title {
            font-weight: 700;
            font-size: 14px;
            color: #f1f5f9;
            margin-bottom: 4px;
        }

        .popup-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .popup-detail {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-top: 1px solid #334155;
        }

        .popup-price {
            font-weight: 700;
            color: #34d399;
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="brand">
            <span class="brand-badge">SPOTTER</span>
            <span class="brand-title">Fuel Route Planner</span>
        </div>

        <form id="route-form">
            <div class="form-group">
                <label for="start-input">Origin Location</label>
                <input type="text" id="start-input" value="" placeholder="e.g. Dallas, TX" required>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label for="finish-input">Destination Location</label>
                <input type="text" id="finish-input" value="" placeholder="e.g. Atlanta, GA" required>
            </div>

            <div style="margin-top: 10px;">
                <label style="margin-bottom: 6px; display: block;">Quick Presets</label>
                <div class="presets">
                    <button type="button" class="preset-btn" onclick="setPreset('Austin, TX', 'Houston, TX')">Austin &rarr; Houston (&lt;500mi)</button>
                    <button type="button" class="preset-btn" onclick="setPreset('Dallas, TX', 'Atlanta, GA')">Dallas &rarr; Atlanta (~780mi)</button>
                    <button type="button" class="preset-btn" onclick="setPreset('Los Angeles, CA', 'New York, NY')">LA &rarr; NYC (Coast-to-Coast)</button>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit" style="margin-top: 16px; width: 100%;">
                <span>Calculate Optimal Route</span>
            </button>
        </form>

        <div id="error-box"></div>

        <div id="stats-panel" style="display: none;">
            <label>Trip Financial Summary</label>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Distance</div>
                    <div class="stat-value" id="stat-dist">0.0 mi</div>
                </div>
                <div class="stat-card highlight">
                    <div class="stat-label">Total Fuel Cost</div>
                    <div class="stat-value" id="stat-cost">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Stops Needed</div>
                    <div class="stat-value" id="stat-stops">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Gallons Bought</div>
                    <div class="stat-value" id="stat-gallons">0.0 gal</div>
                </div>
            </div>

            <label style="margin-top: 18px; display: block;">Scheduled Refueling Stops</label>
            <div id="stops-list"></div>
        </div>
    </aside>

    <main id="map-container">
        <div id="map"></div>
        
        <div class="legend">
            <div class="legend-item"><span class="legend-dot dot-route"></span> Driving Route</div>
            <div class="legend-item"><span class="legend-dot dot-start"></span> Start Location</div>
            <div class="legend-item"><span class="legend-dot dot-stop"></span> Refueling Stop</div>
            <div class="legend-item"><span class="legend-dot dot-end"></span> Destination</div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const map = L.map('map', {
            zoomControl: true
        }).setView([39.8283, -98.5795], 5);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA',
            maxZoom: 18
        }).addTo(map);

        let currentLayers = [];

        function clearLayers() {
            currentLayers.forEach(layer => map.removeLayer(layer));
            currentLayers = [];
        }

        function setPreset(start, finish) {
            document.getElementById('start-input').value = start;
            document.getElementById('finish-input').value = finish;
            document.getElementById('route-form').dispatchEvent(new Event('submit'));
        }

        async function fetchAndRenderRoute(start, finish) {
            const btnSubmit = document.getElementById('btn-submit');
            const errorBox = document.getElementById('error-box');
            const statsPanel = document.getElementById('stats-panel');
            const stopsList = document.getElementById('stops-list');

            errorBox.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Planning Route...';

            try {
                const response = await fetch(`/api/v1/route/plan/?start=${encodeURIComponent(start)}&finish=${encodeURIComponent(finish)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to retrieve fuel route plan.');
                }

                clearLayers();
                stopsList.innerHTML = '';

                document.getElementById('stat-dist').textContent = `${data.route_distance_miles.toFixed(1)} mi`;
                document.getElementById('stat-cost').textContent = `$${data.total_cost.toFixed(2)}`;
                document.getElementById('stat-stops').textContent = data.total_stops;
                document.getElementById('stat-gallons').textContent = `${data.total_gallons.toFixed(1)} gal`;
                statsPanel.style.display = 'block';

                let routePolyline = null;
                const bounds = L.latLngBounds();

                data.features.forEach(feature => {
                    if (feature.geometry.type === 'LineString') {
                        const latLngs = feature.geometry.coordinates.map(c => [c[1], c[0]]);
                        routePolyline = L.polyline(latLngs, {
                            color: '#2563eb',
                            weight: 5,
                            opacity: 0.85
                        }).addTo(map);
                        currentLayers.push(routePolyline);

                        latLngs.forEach(pt => bounds.extend(pt));

                        const startPt = latLngs[0];
                        const endPt = latLngs[latLngs.length - 1];

                        const startMarker = L.circleMarker(startPt, {
                            radius: 8,
                            color: '#ffffff',
                            fillColor: '#10b981',
                            fillOpacity: 1,
                            weight: 2
                        }).bindPopup(`<div class="popup-title">Trip Origin</div><div class="popup-desc">${start}</div>`).addTo(map);
                        currentLayers.push(startMarker);

                        const endMarker = L.circleMarker(endPt, {
                            radius: 8,
                            color: '#ffffff',
                            fillColor: '#ef4444',
                            fillOpacity: 1,
                            weight: 2
                        }).bindPopup(`<div class="popup-title">Final Destination</div><div class="popup-desc">${finish}</div>`).addTo(map);
                        currentLayers.push(endMarker);
                    } else if (feature.geometry.type === 'Point' && feature.properties.type === 'fuel_stop') {
                        const props = feature.properties;
                        const pt = [feature.geometry.coordinates[1], feature.geometry.coordinates[0]];

                        const stopMarker = L.circleMarker(pt, {
                            radius: 9,
                            color: '#ffffff',
                            fillColor: '#f59e0b',
                            fillOpacity: 1,
                            weight: 2
                        }).addTo(map);

                        const popupHtml = `
                            <div class="popup-title">${props.name}</div>
                            <div class="popup-desc">${props.address}, ${props.city}, ${props.state}</div>
                            <div class="popup-detail"><span>Retail Price:</span><span class="popup-price">$${props.price.toFixed(2)}/gal</span></div>
                            <div class="popup-detail"><span>Mile Marker:</span><span>${props.mile_marker.toFixed(1)} mi</span></div>
                            <div class="popup-detail"><span>Fuel Purchased:</span><span>${props.gallons_bought.toFixed(1)} gal</span></div>
                            <div class="popup-detail"><span>Stop Expense:</span><span>$${props.cost.toFixed(2)}</span></div>
                        `;
                        stopMarker.bindPopup(popupHtml);
                        currentLayers.push(stopMarker);

                        const stopItem = document.createElement('div');
                        stopItem.className = 'stop-item';
                        stopItem.innerHTML = `
                            <div class="stop-item-title">${props.name}</div>
                            <div class="stop-item-meta">${props.city}, ${props.state} &bull; Mile ${props.mile_marker.toFixed(1)}</div>
                            <div class="stop-item-cost">$${props.price.toFixed(2)}/gal &bull; ${props.gallons_bought.toFixed(1)} gal ($${props.cost.toFixed(2)})</div>
                        `;
                        stopItem.onclick = () => {
                            map.setView(pt, 12);
                            stopMarker.openPopup();
                        };
                        stopsList.appendChild(stopItem);
                    }
                });

                if (routePolyline && bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

                if (data.total_stops === 0) {
                    const emptyItem = document.createElement('div');
                    emptyItem.style.color = '#94a3b8';
                    emptyItem.style.fontSize = '12px';
                    emptyItem.textContent = 'Trip is under 500 miles. Completed on initial full tank with zero stops!';
                    stopsList.appendChild(emptyItem);
                }

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
                statsPanel.style.display = 'none';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Calculate Optimal Route';
            }
        }

        document.getElementById('route-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const start = document.getElementById('start-input').value.trim();
            const finish = document.getElementById('finish-input').value.trim();
            if (start && finish) {
                fetchAndRenderRoute(start, finish);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const start = document.getElementById('start-input').value.trim();
            const finish = document.getElementById('finish-input').value.trim();
            if (start && finish) {
                fetchAndRenderRoute(start, finish);
            }
        });
    </script>
</body>
</html>
